# Workflow TEMPORAIRE — à supprimer une fois la sauvegarde récupérée.
#
# Le keystore de signature n'existe plus que dans le secret ANDROID_KEYSTORE_B64,
# et GitHub ne permet jamais de relire un secret. Ce workflow est le seul moyen
# d'en ressortir une copie pour la sauvegarder hors de GitHub.
#
# Le dépôt étant PUBLIC, ses artifacts sont téléchargeables par n'importe qui :
# le keystore est donc chiffré en AES-256 AVANT d'être publié. Le blob seul est
# inexploitable sans la phrase secrète, qui ne quitte jamais les secrets.
name: Export keystore (temporaire)

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Chiffrer le keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PASSPHRASE: ${{ secrets.KEYSTORE_EXPORT_PASSPHRASE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::secret manquant"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android.keystore
          echo "Keystore restauré : $(stat -c%s android.keystore) octets"

          # Empreinte tracée pour vérifier après déchiffrement qu'on a bien
          # récupéré la bonne clé, sans jamais exposer la clé privée.
          keytool -list -v -keystore android.keystore -storepass chimiepiscine \
            -alias android | grep -iE "SHA1:|SHA256:" || true

          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in android.keystore -out android.keystore.enc -pass env:PASSPHRASE
          rm -f android.keystore
          echo "Chiffré : $(stat -c%s android.keystore.enc) octets"

      - name: Publier l'artifact chiffré
        uses: actions/upload-artifact@v4
        with:
          name: keystore-encrypted
          path: android.keystore.enc
          retention-days: 1
