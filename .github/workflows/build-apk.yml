name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      pwa_url:
        description: 'URL HTTPS de la PWA déployée'
        required: true
        default: 'https://chimie-piscine.vercel.app'

permissions:
  contents: write   # nécessaire pour que softprops/action-gh-release crée la Release sur tag

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        # Version ÉPINGLÉE : c'est bubblewrap (et non ce workflow) qui décide du
        # targetSdkVersion généré et de la version exacte de build-tools exigée.
        # Une montée de version silencieuse casse le build ou change la cible API
        # sans qu'on s'en aperçoive. 1.25.0 → compileSdk/targetSdk 36 (Android 16,
        # exigé par Google Play au 31/08/2026) et build-tools 36.1.0.
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Determine PWA URL
        id: url
        run: |
          if [ -n "${{ github.event.inputs.pwa_url }}" ]; then
            echo "url=${{ github.event.inputs.pwa_url }}" >> $GITHUB_OUTPUT
          else
            echo "url=${{ vars.PWA_URL || 'https://chimie-piscine.vercel.app' }}" >> $GITHUB_OUTPUT
          fi

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "name=1.3.0" >> $GITHUB_OUTPUT
          fi
          echo "code=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Restore stable signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p android-build
          cd android-build
          # Keystore STABLE (alias android, pass chimiepiscine) restauré depuis le
          # secret. SHA-256 94:FD:50:4B... = celui déclaré dans
          # /.well-known/assetlinks.json → la TWA s'ouvre en plein écran (pas de
          # barre Chrome) et la signature est constante (requis par le Play Store).
          # Ne JAMAIS revenir à keytool -genkey (clé aléatoire à chaque build).
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::secret ANDROID_KEYSTORE_B64 manquant"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android.keystore
          echo "Keystore restauré ($(stat -c%s android.keystore) octets). Fingerprint :"
          keytool -list -v -keystore android.keystore -storepass chimiepiscine -alias android \
            | grep -i "SHA256:" || true

      - name: Pre-configure Bubblewrap (skip JDK/SDK install prompts)
        run: |
          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "--- ANDROID_HOME contents ---"
          ls -la "$SDK_PATH" | head -15
          echo "--- cmdline-tools contents ---"
          ls -la "$SDK_PATH/cmdline-tools" || true

          # Bubblewrap exige $SDK/cmdline-tools/latest/bin/sdkmanager mais le runner
          # n'expose que des sous-répertoires versionnés (ex 16.0, 19.0). On crée
          # le symlink "latest" vers la version la plus récente.
          if [ ! -d "$SDK_PATH/cmdline-tools/latest" ]; then
            cd "$SDK_PATH/cmdline-tools"
            LATEST_VER=$(ls -d */ 2>/dev/null | grep -v "^latest/$" | sort -rV | head -1 | tr -d /)
            echo "Symlinking cmdline-tools/latest -> $LATEST_VER"
            if [ -n "$LATEST_VER" ]; then
              ln -sf "$LATEST_VER" latest
            fi
            cd -
          fi
          ls -la "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" || \
            (echo "ERREUR : sdkmanager introuvable" && exit 1)

          # `bubblewrap build` valide l'existence de $SDK/tools/bin/sdkmanager
          # (emplacement "tools" legacy, supprimé des runners GitHub qui n'ont plus
          # que cmdline-tools). On symlink tools -> cmdline-tools/latest pour que la
          # validation AndroidSdkTools.create() passe.
          if [ ! -e "$SDK_PATH/tools" ]; then
            ln -sf "$SDK_PATH/cmdline-tools/latest" "$SDK_PATH/tools"
            echo "Symlinking tools -> cmdline-tools/latest"
          fi
          ls -la "$SDK_PATH/tools/bin/sdkmanager" || echo "WARN: tools/bin/sdkmanager absent"

          # Bubblewrap exige EXACTEMENT la build-tools de BUILD_TOOLS_VERSION
          # (codée en dur dans @bubblewrap/core, checkBuildTools() teste la
          # présence du dossier). En 1.25.0 c'est 36.1.0, et le gabarit gradle
          # compile/cible l'API 36 → il faut aussi platforms;android-36.
          # ⚠️ Ces trois valeurs sont liées à la version épinglée du CLI plus
          # haut : si tu montes bubblewrap, revérifie BUILD_TOOLS_VERSION et le
          # targetSdkVersion de template_project/app/build.gradle.
          SDKMANAGER="$SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;36.1.0" "platforms;android-36" "platform-tools" || \
            (echo "ERREUR : installation build-tools 36.1.0 échouée" && exit 1)
          ls -la "$SDK_PATH/build-tools/36.1.0/aapt2" || echo "WARN: aapt2 absent"

          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "$SDK_PATH"
          }
          EOF
          echo "--- ~/.bubblewrap/config.json ---"
          cat ~/.bubblewrap/config.json

          # Gradle en CI : daemon désactivé (sinon il reste suspendu et le step pend),
          # console plain (pas d'animations/curseur), pas de watch fs.
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<EOF
          org.gradle.daemon=false
          org.gradle.console=plain
          org.gradle.vfs.watch=false
          org.gradle.welcome=never
          EOF
          echo "--- ~/.gradle/gradle.properties ---"
          cat ~/.gradle/gradle.properties

      - name: Initialize Bubblewrap project
        working-directory: android-build
        run: |
          HOST=$(echo "${{ steps.url.outputs.url }}" | sed 's|https://||;s|/.*||')

          # Backup file : init va écraser twa-manifest.json, on le restaurera après.
          cat > twa-manifest-custom.json <<EOF
          {
            "packageId": "fr.yannickuhrig.chimiepiscine",
            "host": "$HOST",
            "name": "Chimie Piscine",
            "launcherName": "Piscine",
            "display": "standalone",
            "themeColor": "#0a3d62",
            "navigationColor": "#0a3d62",
            "navigationColorDark": "#041d2e",
            "navigationDividerColor": "#0a3d62",
            "navigationDividerColorDark": "#041d2e",
            "backgroundColor": "#041d2e",
            "splashScreenFadeOutDuration": 300,
            "enableNotifications": true,
            "startUrl": "/index.html",
            "iconUrl": "${{ steps.url.outputs.url }}/icon-512.png",
            "maskableIconUrl": "${{ steps.url.outputs.url }}/icon-512.png",
            "appVersionName": "${{ steps.ver.outputs.name }}",
            "appVersionCode": ${{ steps.ver.outputs.code }},
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "${{ steps.url.outputs.url }}/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {"enabled": false},
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "${{ steps.url.outputs.url }}/",
            "minSdkVersion": 21,
            "orientation": "portrait",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            }
          }
          EOF

          # Bubblewrap init : stdin fermé → inquirer prend les defaults issus du
          # web manifest (ne PAS faire `yes |`, ça injecte "y" dans les champs texte
          # et casse le packageId). Génère le squelette du projet Android (gradlew…).
          bubblewrap init --manifest="${{ steps.url.outputs.url }}/manifest.json" --directory=. </dev/null || true

          # Restaure notre manifest custom (écrasement de celui généré par init)
          cp twa-manifest-custom.json twa-manifest.json

          # Régénère le projet Android à partir de notre manifest custom.
          # --skipVersionUpgrade est ESSENTIEL : sinon, comme appVersionName
          # ("1.22.3") != appVersionCode ("84"), bubblewrap prompte le versionName
          # (validation longueur >=1). Avec stdin fermé/`yes ""` → boucle infinie
          # (input vide rejeté à l'infini) jusqu'au timeout. Le flag saute ce bloc.
          # `update` écrit aussi manifest-checksum.txt (sha1 du manifest) → `build`
          # ne reposera plus la question "regenerate?".
          bubblewrap update --skipVersionUpgrade </dev/null

          # Filet de sécurité : garantit que le checksum existe et correspond
          # (sha1 hex du contenu de twa-manifest.json), même si update changeait.
          node -e "const c=require('crypto'),f=require('fs');f.writeFileSync('manifest-checksum.txt',c.createHash('sha1').update(f.readFileSync('twa-manifest.json')).digest('hex'))"
          echo "--- manifest-checksum.txt ---"; cat manifest-checksum.txt; echo
          echo "--- gradlew présent ? ---"; ls -la gradlew

          # Garde-fou niveau d'API cible. Google Play refuse les mises à jour des
          # applis qui ciblent une API de plus d'un an (Chimie Piscine : API 36
          # exigée au 31/08/2026). Le targetSdkVersion vient du gabarit de
          # bubblewrap, pas de twa-manifest.json : une régression est donc
          # invisible ici et n'apparaît qu'après coup, en notification Play
          # Console. On échoue le build tout de suite.
          MIN_TARGET_SDK=36
          TARGET_SDK=$(grep -oP 'targetSdkVersion\s+\K[0-9]+' app/build.gradle | head -1)
          echo "targetSdkVersion généré = ${TARGET_SDK:-introuvable}"
          if [ -z "$TARGET_SDK" ] || [ "$TARGET_SDK" -lt "$MIN_TARGET_SDK" ]; then
            echo "::error::targetSdkVersion=${TARGET_SDK:-introuvable} < $MIN_TARGET_SDK requis par Google Play. Monte @bubblewrap/cli et aligne build-tools/platforms."
            exit 1
          fi

      - name: Re-restore keystore before signing
        working-directory: android-build
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          # `bubblewrap update` appelle removeTwaProject(), qui nettoie le dossier
          # du projet — or android.keystore s'y trouve. Sans cette restauration,
          # `bubblewrap build` en régénère un avec les MÊMES mots de passe mais un
          # certificat différent : l'AAB est signé, le build est vert, et c'est
          # seulement au moment de l'import que Google le refuse (« signé avec la
          # mauvaise clé »). Vécu le 01/08/2026.
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android.keystore
          keytool -list -v -keystore android.keystore -storepass chimiepiscine \
            -alias android | grep -i "SHA1:" || true

      - name: Build APK
        working-directory: android-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: chimiepiscine
          BUBBLEWRAP_KEY_PASSWORD: chimiepiscine
        run: |
          # Le manifest-checksum.txt généré à l'étape précédente correspond au
          # twa-manifest.json → `build` ne pose AUCUN prompt "regenerate?" et
          # compile directement le projet déjà généré. stdin fermé par sûreté.
          # `timeout` garde-fou : échec propre (libère les logs) si Gradle bloque.
          set -o pipefail
          timeout 1200 bubblewrap build --skipPwaValidation </dev/null || {
            code=$?
            echo "::error::bubblewrap build a échoué/timeout (code $code)"
            echo "=== gradlew présent ? ==="; ls -la gradlew 2>&1 || true
            echo "=== build/outputs ==="; find . -path "*outputs*" -name "*.apk" -o -path "*outputs*" -name "*.aab" 2>/dev/null | head
            exit $code
          }

      - name: Verify signing certificate
        working-directory: android-build
        run: |
          # Empreinte de la clé d'IMPORTATION enregistrée chez Google Play. Un AAB
          # signé avec autre chose est refusé à l'import, mais rien dans le build
          # ne le signale : on vérifie donc le bundle réellement produit, et non
          # le keystore présent sur le disque.
          #
          # L'ancienne clé (`26:FF:86:86:…`) a été perdue ; une réinitialisation a
          # été demandée le 01/08/2026 et Google bascule sur celle du keystore CI
          # le 03/08/2026 à 08:42 UTC. Aucun import n'est accepté avant cette date,
          # quelle que soit la signature.
          EXPECTED_SHA1="75:90:E3:01:06:39:63:01:24:A1:69:0C:4E:C5:96:7A:00:4D:E2:3B"

          AAB=$(find . -name "*.aab" -not -path "*/build/intermediates/*" | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::aucun .aab trouvé pour vérifier la signature"; exit 1
          fi

          ACTUAL_SHA1=$(keytool -printcert -jarfile "$AAB" \
            | grep -i "SHA1:" | head -1 | sed 's/.*SHA1: *//' | tr -d '[:space:]')
          echo "AAB          : $AAB"
          echo "SHA1 attendu : $EXPECTED_SHA1"
          echo "SHA1 trouvé  : ${ACTUAL_SHA1:-introuvable}"

          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::L'AAB est signé avec la mauvaise clé (${ACTUAL_SHA1:-introuvable}). Google Play refusera l'import. Vérifie le secret ANDROID_KEYSTORE_B64 et l'étape de re-restauration du keystore."
            exit 1
          fi
          echo "Signature conforme à la clé d'importation Play."

      - name: Find APK
        id: find_apk
        working-directory: android-build
        run: |
          APK=$(find . -name "*.apk" -not -path "*/build/intermediates/*" | head -1)
          echo "Found: $APK"
          echo "apk_path=android-build/$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chimie-piscine-apk
          path: android-build/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB (for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: chimie-piscine-aab
          path: android-build/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-build/*.apk
            android-build/*.aab
          generate_release_notes: true
